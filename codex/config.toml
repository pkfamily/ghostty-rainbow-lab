# Codex CLI settings that complement the Ghostty Rainbow setup.
# Install at ~/.codex/config.toml (merge with an existing file).

[tui]
# Native Codex items; unlike Claude Code, Codex does not currently support an
# external command-backed status line.
status_line = [
  "model-with-reasoning",
  "project-name",
  "git-branch",
  "run-state",
  "context-used",
]
status_line_use_colors = true

# Let Codex own the tab title while its TUI is active. Ghostty's shell title
# hook is disabled in this setup, so this does not fight zsh's title updates.
terminal_title = ["activity", "project"]
